
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101319">

    <title>Baggyham</title>
    <meta name="description" content="A little corner of the internet.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: #101319;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .year {
            color: #64748b;
            font-size: 12px;
            letter-spacing: 2px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
        }

        h1 {
            font-size: clamp(36px, 6vw, 64px);
            letter-spacing: -2px;
            margin: 0 0 16px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 18px;
            margin: 0 0 36px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #334155;
            border-radius: 50px;
            padding: 10px 18px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        footer {
            margin: 0 8%;
            padding: 24px 0;
            border-top: 1px solid #273244;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">baggyham</div>
    <div class="year">EST. 2026</div>
</header>

<main>
    <h1>Baggyham</h1>
    <p class="subtitle">The Jarsmens corner</p>
</main>

<footer>
    &copy; 2026 Baggyham
</footer>

</body>
</html>
